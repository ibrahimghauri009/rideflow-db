<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RideFlow - Rider</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3f4f6;
  --white: #ffffff;
  --crimson: #dc143c;
  --crimson-dark: #b01030;
  --crimson-light: #fff1f2;
  --border: #e5e7eb;
  --text: #111827;
  --muted: #6b7280;
  --shadow: 0 10px 24px rgba(0,0,0,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Poppins', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

.header {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 0 28px;
  height: 60px;
  display: flex;
  align-items: center;
  gap: 14px;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: var(--shadow);
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-icon {
  width: 34px; height: 34px; border-radius: 9px;
  background: var(--crimson); color: #fff; display: flex; align-items: center;
  justify-content: center; font-size: 0.9rem; font-weight: 700;
}
.logo-name { font-size: 0.92rem; font-weight: 700; }
.logo-sub { font-size: 0.6rem; color: var(--muted); font-weight: 400; }
.header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

.icon {
  width: 14px;
  height: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-right: 6px;
  color: var(--crimson);
}
.icon svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }

.btn {
  font-family: 'Poppins', sans-serif;
  font-size: 0.72rem;
  font-weight: 600;
  padding: 7px 14px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  transition: all 0.15s;
  text-decoration: none;
  display: inline-block;
}
.btn-pri { background: var(--crimson); color: #fff; }
.btn-pri:hover { background: var(--crimson-dark); transform: translateY(-1px); }
.btn-out { background: transparent; color: var(--crimson); border: 1px solid var(--crimson); }
.btn-out:hover { background: var(--crimson-light); }
.btn-ghost { background: #f9fafb; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover { color: var(--text); }
.btn-sm { padding: 5px 11px; font-size: 0.67rem; }
.btn-full { width: 100%; margin-top: 12px; }
.btn:disabled { opacity: 0.6; cursor: not-allowed; }

.content { padding: 26px 28px; max-width: 980px; margin: 0 auto; }

.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
  animation: fadeUp 0.2s ease;
}
.card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
.card-title { font-size: 0.82rem; font-weight: 600; }
.card-sub { font-size: 0.64rem; color: var(--muted); margin-top: 2px; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(6px);} to {opacity:1; transform: translateY(0);} }

.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 720px){ .g2 { grid-template-columns: 1fr; } }

label { display: block; font-size: 0.68rem; font-weight: 500; margin-bottom: 4px; margin-top: 12px; }
label:first-child { margin-top: 0; }
input, textarea, select {
  width: 100%;
  font-family: 'Poppins', sans-serif;
  font-size: 0.75rem;
  padding: 8px 11px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #fff;
  color: var(--text);
  outline: none;
  transition: border 0.15s;
}
input:focus, textarea:focus, select:focus { border-color: var(--crimson); }
textarea { resize: vertical; min-height: 70px; }

.badge { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 20px; font-size: 0.6rem; font-weight: 600; }
.bg { background: #dcfce7; color: #166534; }
.bb { background: #e0f2fe; color: #1d4ed8; }
.by { background: #fef3c7; color: #92400e; }
.br { background: #fee2e2; color: #991b1b; }
.bgr { background: #f3f4f6; color: var(--muted); }

.tag {
  display: inline-flex;
  align-items: center;
  padding: 2px 6px;
  border-radius: 6px;
  font-size: 0.6rem;
  font-weight: 600;
  background: var(--crimson-light);
  color: #9f1239;
  margin-left: 6px;
}

.alert { padding: 9px 13px; border-radius: 8px; font-size: 0.71rem; font-weight: 500; margin-top: 10px; }
.alert-ok { background: #dcfce7; border: 1px solid #bbf7d0; color: #166534; }
.alert-err { background: #fee2e2; border: 1px solid #fecaca; color: #991b1b; }

.ride-wrap { margin-bottom: 12px; }
.ride-wrap.open .ride-card { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.ride-card {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  background: #fafafa;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.ride-card:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(0,0,0,0.08); }
.ride-title { font-size: 0.78rem; font-weight: 600; }
.ride-meta { font-size: 0.7rem; color: var(--muted); line-height: 1.6; margin-top: 6px; }
.ride-actions { display: flex; flex-direction: column; gap: 6px; }

.ride-details {
  display: none;
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 12px 12px;
  background: #fff;
  padding: 12px 14px;
}
.ride-details.open { display: block; animation: slideDown 0.2s ease; }
@keyframes slideDown { from { opacity:0; transform: translateY(-4px);} to {opacity:1; transform: translateY(0);} }

.detail-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; font-size: 0.7rem; color: var(--muted); }
@media (max-width: 720px){ .detail-grid { grid-template-columns: 1fr; } }

.offer-card {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 8px;
  background: #fafafa;
}
.offer-meta { font-size: 0.68rem; color: var(--muted); line-height: 1.6; }

.fare-box {
  margin-top: 10px;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px dashed var(--border);
  background: #fafafa;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.fare-amt { font-size: 1.1rem; font-weight: 700; color: var(--crimson); }
.note { font-size: 0.68rem; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>

<header class="header">
  <div class="logo">
    <div class="logo-icon">R</div>
    <div><div class="logo-name">RideFlow</div><div class="logo-sub">Rider Console</div></div>
  </div>
  <div class="header-right">
    <div style="font-size:0.72rem;color:var(--muted)">Rider ID: <b id="rider-id">--</b></div>
    <button class="btn btn-out" onclick="logout()">Logout</button>
  </div>
</header>

<div class="content">
  <div class="card">
    <div class="card-head">
      <div>
        <div class="card-title">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M12 2C7.6 2 4 5.6 4 10c0 5.6 8 12 8 12s8-6.4 8-12c0-4.4-3.6-8-8-8z"/><circle cx="12" cy="10" r="3"/></svg></span>
          New Ride
        </div>
        <div class="card-sub">Post a ride request when you are free</div>
      </div>
    </div>
    <label>Pickup Location</label><input id="rq-pickup" placeholder="e.g. Gulberg III, Lahore">
    <label>Drop-off Location</label><input id="rq-drop" placeholder="e.g. DHA Phase 5, Lahore">
    <div class="g2" style="margin-bottom:0">
      <div><label>Distance (km)</label><input id="rq-dist" type="number" step="0.1" value="5"></div>
      <div><label>Duration (min)</label><input id="rq-dur" type="number" value="15"></div>
    </div>
    <div class="g2" style="margin-bottom:0">
      <div><label>Vehicle Type</label><select id="rq-type"><option>Economy</option><option>Premium</option><option>Bike</option></select></div>
      <div><label>Promo Code (optional)</label><input id="rq-promo" placeholder="SAVE20"></div>
    </div>
    <button class="btn btn-ghost btn-sm" id="rq-estimate" onclick="estimateFare()">
      <span class="icon"><svg viewBox="0 0 24 24"><path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></span>
      Estimate Fare
    </button>
    <div id="rq-fare"></div>
    <button class="btn btn-pri btn-full" id="rq-btn" onclick="requestRide()">Post Ride</button>
    <div id="rq-msg"></div>
    <div id="rq-note" style="font-size:0.68rem;color:var(--muted);margin-top:10px"></div>
  </div>

  <div class="card">
    <div class="card-head">
      <div>
        <div class="card-title">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></span>
          Wallet
        </div>
        <div class="card-sub">Manage your wallet balance</div>
      </div>
    </div>
    <div class="fare-box">
      <div>
        <div style="font-size:0.66rem;color:var(--muted)">Current balance</div>
        <div class="fare-amt" id="wallet-balance">PKR 0</div>
      </div>
      <div style="text-align:right">
        <label style="margin:0 0 6px">Top-up amount</label>
        <input id="wallet-amount" type="number" placeholder="e.g. 1000" style="max-width:150px">
      </div>
    </div>
    <button class="btn btn-pri" style="margin-top:12px" onclick="topupWallet()">Add Funds</button>
    <div id="wallet-msg"></div>
  </div>

  <div class="card">
    <div class="card-head">
      <div>
        <div class="card-title">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M3 12h18"/><path d="M3 6h18"/><path d="M3 18h18"/></svg></span>
          Rides
        </div>
        <div class="card-sub">Active, completed, cancelled, and unreviewed rides</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <select id="ride-filter" onchange="renderRides()" style="width:160px">
          <option value="all">All</option>
          <option value="new">New (Requested/Offered)</option>
          <option value="progress">In Progress</option>
          <option value="awaiting">Awaiting Acknowledgement</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
        </select>
        <button class="btn btn-ghost btn-sm" onclick="refreshAll()">Refresh</button>
      </div>
    </div>
    <div id="rides-list"><div style="text-align:center;padding:20px;font-size:0.72rem;color:var(--muted)">Loading rides...</div></div>
  </div>
</div>

<script>
const API = window.location.protocol === 'file:' ? 'http://localhost:5000/api' : `${window.location.origin}/api`;
const STATUS_CLASS = {Requested:'by',Offered:'bb','In Progress':'bb','Rider Completed':'by','Rider Cancelled':'br',Completed:'bg',Cancelled:'br'};
const ACTIVE_STATUSES = new Set(['Requested','Offered','In Progress','Rider Completed','Rider Cancelled']);
const CLOSED_STATUSES = new Set(['Completed','Cancelled']);

let riderId = null;
let state = {
  active: [],
  history: [],
  ratings: new Set(),
  drivers: {},
  offers: {},
  byId: {}
};

function g(id){ return document.getElementById(id); }
function bdg(v){ return `<span class="badge ${STATUS_CLASS[v]||'bgr'}">${v}</span>`; }
function msg(id, text, ok=true){ const el=g(id); if(el) el.innerHTML = `<div class="alert ${ok?'alert-ok':'alert-err'}">${text}</div>`; }

async function api(path, method='GET', body=null){
  try{
    const opts = { method, headers: {'Content-Type':'application/json'} };
    if(body) opts.body = JSON.stringify(body);
    return (await fetch(API + path, opts)).json();
  }catch{ return { error: 'Server offline' }; }
}

async function loadWallet(){
  const r = await api(`/wallet/${riderId}`);
  if(r && !r.error){
    g('wallet-balance').textContent = `PKR ${parseFloat(r.wallet_balance || 0).toFixed(0)}`;
  }
}

async function topupWallet(){
  const amount = parseFloat(g('wallet-amount').value || 0);
  if(!amount || amount <= 0){
    msg('wallet-msg', 'Enter a valid top-up amount', false);
    return;
  }
  const r = await api(`/wallet/${riderId}/topup`, 'POST', { amount });
  msg('wallet-msg', r.message || r.error, !r.error);
  if(!r.error){
    g('wallet-amount').value = '';
    loadWallet();
  }
}

function init(){
  const role = localStorage.getItem('role');
  if(role !== 'rider'){ window.location.href = 'index.html'; return; }
  riderId = localStorage.getItem('rider_id') || localStorage.getItem('user_id');
  if(!riderId){ window.location.href = 'index.html'; return; }
  g('rider-id').textContent = riderId;
  refreshAll();
}

async function refreshAll(){
  const [rides, history, ratings, drivers] = await Promise.all([
    api(`/rides?rider_id=${riderId}`),
    api(`/ride-history?rider_id=${riderId}`),
    api('/ratings'),
    api('/drivers')
  ]);

  state.active = Array.isArray(rides) ? rides : [];
  state.history = Array.isArray(history) ? history : [];
  state.ratings = new Set((Array.isArray(ratings) ? ratings : []).filter(r => r.rated_by === 'Rider').map(r => String(r.ride_id)));
  state.drivers = {};
  if(Array.isArray(drivers)){
    drivers.forEach(d => { state.drivers[String(d.driver_id)] = { user_id: d.user_id, name: d.full_name }; });
  }
  updateNewRideState();
  renderRides();
  loadWallet();
}

function updateNewRideState(){
  const activeRide = state.active.find(r => ACTIVE_STATUSES.has(r.ride_status));
  const disabled = Boolean(activeRide);
  ['rq-pickup','rq-drop','rq-dist','rq-dur','rq-type','rq-promo','rq-btn','rq-estimate'].forEach(id => { g(id).disabled = disabled; });
  if(disabled){
    g('rq-note').textContent = `You already have an active ride (#${activeRide.ride_id}). Manage it below before posting a new one.`;
  } else {
    g('rq-note').textContent = 'No active ride. You can post a new request.';
  }
}

function setFareBox(data){
  g('rq-fare').innerHTML = `
    <div class="fare-box">
      <div>
        <div style="font-size:0.66rem;color:var(--muted)">Recommended (${data.vehicle_type})</div>
        <div class="fare-amt">PKR ${parseFloat(data.final_fare).toFixed(0)}</div>
        ${parseFloat(data.discount) > 0 ? `<div style="font-size:0.64rem;color:#166534">Promo saved PKR ${parseFloat(data.discount).toFixed(0)}</div>` : ''}
      </div>
      <div style="font-size:0.68rem;color:var(--muted)">~ ${parseFloat(data.distance_km).toFixed(2)} km / ${Math.ceil(data.duration_min)} min</div>
    </div>
  `;
}

async function estimateFare(silent=false){
  const pickup = g('rq-pickup').value;
  const dropoff = g('rq-drop').value;
  if(!pickup || !dropoff){
    if(!silent) msg('rq-msg', 'Enter pickup and drop-off locations first', false);
    return { error: 'missing' };
  }
  const payload = {
    pickup,
    dropoff,
    vehicle_type: g('rq-type').value,
    promo_code: g('rq-promo').value
  };
  const r = await api('/fare/recommend', 'POST', payload);
  if(r.error){
    if(!silent) msg('rq-msg', r.error, false);
    return r;
  }
  g('rq-dist').value = parseFloat(r.distance_km).toFixed(2);
  g('rq-dur').value = Math.ceil(r.duration_min);
  setFareBox(r);
  return r;
}

async function requestRide(){
  if(!g('rq-dist').value || !g('rq-dur').value){
    const est = await estimateFare(true);
    if(est.error){
      msg('rq-msg', 'Please calculate fare to get distance and duration', false);
      return;
    }
  }
  const payload = {
    rider_id: riderId,
    pickup_location: g('rq-pickup').value,
    dropoff_location: g('rq-drop').value,
    promo_code: g('rq-promo').value,
    distance_km: g('rq-dist').value,
    duration_min: g('rq-dur').value
  };
  const r = await api('/rides','POST', payload);
  if(r.error){ msg('rq-msg', r.error, false); return; }
  msg('rq-msg', `Ride posted. ID #${r.ride_id}`, true);
  refreshAll();
}

function normalizeRide(r, type){
  const status = type === 'history' ? r.final_status : r.ride_status;
  let driverUserId = r.driver_user_id || null;
  let driverName = r.driver_name || null;
  if(!driverUserId && r.driver_id && state.drivers[String(r.driver_id)]){
    driverUserId = state.drivers[String(r.driver_id)].user_id;
    driverName = state.drivers[String(r.driver_id)].name;
  }
  return {
    id: r.ride_id,
    type,
    status,
    pickup: r.pickup_location,
    dropoff: r.dropoff_location,
    fare: r.fare,
    distance: r.distance_km,
    duration: r.duration_min,
    created_at: r.created_at,
    archived_at: r.archived_at,
    driver_id: r.driver_id,
    driver_user_id: driverUserId,
    driver_name: driverName
  };
}

function collectRides(){
  const active = state.active.filter(r => !CLOSED_STATUSES.has(r.ride_status)).map(r => normalizeRide(r, 'active'));
  const history = state.history.map(r => normalizeRide(r, 'history'));
  const list = [...active, ...history];
  return list.sort((a,b) => {
    const ta = new Date(a.archived_at || a.created_at || 0).getTime();
    const tb = new Date(b.archived_at || b.created_at || 0).getTime();
    return tb - ta;
  });
}

function matchesFilter(ride, filter){
  if(filter === 'new') return ['Requested','Offered'].includes(ride.status);
  if(filter === 'progress') return ride.status === 'In Progress';
  if(filter === 'awaiting') return ['Rider Completed','Rider Cancelled'].includes(ride.status);
  if(filter === 'completed') return ride.status === 'Completed';
  if(filter === 'cancelled') return ride.status === 'Cancelled';
  return true;
}

function renderRides(){
  const filter = g('ride-filter').value;
  const rides = collectRides().filter(r => matchesFilter(r, filter));
  state.byId = {};
  rides.forEach(r => { state.byId[r.id] = r; });
  if(!rides.length){
    g('rides-list').innerHTML = '<div style="text-align:center;padding:20px;font-size:0.72rem;color:var(--muted)">No rides found</div>';
    return;
  }
  g('rides-list').innerHTML = rides.map(renderRideCard).join('');
}

function renderRideCard(ride){
  const needsReview = ride.status === 'Completed' && !state.ratings.has(String(ride.id));
  const driverLabel = ride.driver_name ? `${ride.driver_name} (ID ${ride.driver_user_id || ride.driver_id || '-'})` : (ride.driver_id ? `Driver #${ride.driver_id}` : 'Unassigned');

  let actions = '';
  if(ride.type === 'active'){
    if(['Requested','Offered'].includes(ride.status)){
      actions = `
        <button class="btn btn-pri btn-sm" onclick="toggleDetails(${ride.id}, true)">View Offers</button>
        <button class="btn btn-out btn-sm" onclick="cancelRide(${ride.id})">Cancel</button>
      `;
    } else if(ride.status === 'In Progress'){
      actions = `
        <button class="btn btn-pri btn-sm" onclick="completeRide(${ride.id})">Complete</button>
        <button class="btn btn-out btn-sm" onclick="cancelRide(${ride.id})">Cancel</button>
      `;
    } else {
      actions = `<div style="font-size:0.7rem;color:var(--muted)">Waiting for driver acknowledgement</div>`;
    }
  } else {
    actions = `
      <button class="btn btn-ghost btn-sm" onclick="toggleDetails(${ride.id}, false)">View Details</button>
      ${needsReview ? `<button class="btn btn-pri btn-sm" onclick="toggleDetails(${ride.id}, true)">Review</button>` : ''}
    `;
  }

  const tag = needsReview ? '<span class="tag">Needs Review</span>' : '';

  return `
    <div class="ride-wrap" id="wrap-${ride.id}">
      <div class="ride-card">
        <div>
          <div class="ride-title">Ride #${ride.id} ${bdg(ride.status)} ${tag}</div>
          <div class="ride-meta">${ride.pickup || '-'} → ${ride.dropoff || '-'}<br>Driver: ${driverLabel}<br>Fare: PKR ${ride.fare || '—'}</div>
        </div>
        <div class="ride-actions">${actions}</div>
      </div>
      <div class="ride-details" id="details-${ride.id}">
        ${renderDetails(ride, needsReview)}
      </div>
    </div>
  `;
}

function renderDetails(ride, needsReview){
  const timeLabel = ride.archived_at ? `Archived: ${ride.archived_at}` : (ride.created_at ? `Created: ${ride.created_at}` : '');
  const details = `
    <div class="detail-grid">
      <div><b>Status:</b> ${ride.status}</div>
      <div><b>Time:</b> ${timeLabel || '-'}</div>
      <div><b>Distance:</b> ${ride.distance || '-'} km</div>
      <div><b>Duration:</b> ${ride.duration || '-'} min</div>
    </div>
    <div id="fare-${ride.id}" class="note">Recommended fare: calculating...</div>
  `;

  let extra = '';
  if(ride.type === 'active' && ['Requested','Offered'].includes(ride.status)){
    extra = `<div id="offers-${ride.id}"><div style="font-size:0.7rem;color:var(--muted);margin-top:10px">Loading offers...</div></div>`;
  }
  if(ride.status === 'Completed' && needsReview){
    const driverUserId = ride.driver_user_id || '';
    extra += `
      <div style="margin-top:12px">
        <div style="font-size:0.74rem;font-weight:600">Leave a review</div>
        <div style="font-size:0.64rem;color:var(--muted);margin-top:4px">Driver User ID: ${driverUserId || 'Unknown'}</div>
        <label>Score</label>
        <select id="score-${ride.id}"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select>
        <label>Comment</label>
        <textarea id="comment-${ride.id}" placeholder="Your feedback"></textarea>
        <button class="btn btn-pri btn-sm" onclick="submitReview(${ride.id}, ${driverUserId || 0})">Submit Review</button>
        <div id="review-msg-${ride.id}"></div>
      </div>
    `;
  }
  return details + extra;
}

function toggleDetails(rideId, loadOffers){
  const wrap = g(`wrap-${rideId}`);
  const details = g(`details-${rideId}`);
  const isOpen = details.classList.contains('open');
  if(isOpen){
    details.classList.remove('open');
    wrap.classList.remove('open');
    return;
  }
  details.classList.add('open');
  wrap.classList.add('open');
  if(loadOffers){
    loadOffersForRide(rideId);
  }
  loadFareForRide(rideId);
}

async function loadOffersForRide(rideId){
  const host = g(`offers-${rideId}`);
  if(!host) return;
  const data = await api(`/rides/${rideId}/offers`);
  if(!Array.isArray(data) || !data.length){
    host.innerHTML = '<div style="font-size:0.7rem;color:var(--muted);margin-top:10px">No offers yet</div>';
    return;
  }
  host.innerHTML = data.map(o => `
    <div class="offer-card">
      <div>
        <div style="font-size:0.78rem;font-weight:600">PKR ${parseFloat(o.proposed_fare).toFixed(0)}</div>
        <div class="offer-meta">Driver: <b>${o.driver_name || 'Driver #' + o.driver_id}</b><br>Status: ${bdg(o.status)}</div>
      </div>
      <div>
        ${o.status === 'Pending' ? `<button class="btn btn-pri btn-sm" onclick="acceptOffer(${rideId}, ${o.offer_id})">Accept</button>` : ''}
      </div>
    </div>
  `).join('');
}

async function loadFareForRide(rideId){
  const ride = state.byId[rideId];
  const host = g(`fare-${rideId}`);
  if(!ride || !host){
    return;
  }
  if(!ride.distance || !ride.duration){
    host.textContent = 'Recommended fare: distance data missing';
    return;
  }
  const payload = {
    vehicle_type: 'Economy',
    distance_km: ride.distance,
    duration_min: ride.duration
  };
  const r = await api('/fare/recommend', 'POST', payload);
  if(r.error){
    host.textContent = 'Recommended fare unavailable';
    return;
  }
  host.innerHTML = `Recommended fare (Economy): <b>PKR ${parseFloat(r.final_fare).toFixed(0)}</b>`;
}

async function acceptOffer(rideId, offerId){
  const r = await api(`/rides/${rideId}/accept`, 'POST', { offer_id: offerId, rider_id: riderId });
  if(r.error){ msg('rq-msg', r.error, false); return; }
  refreshAll();
}

async function cancelRide(rideId){
  const r = await api(`/rides/${rideId}/rider-cancel`, 'PUT');
  if(r.error){ msg('rq-msg', r.error, false); return; }
  refreshAll();
}

async function completeRide(rideId){
  const r = await api(`/rides/${rideId}/rider-complete`, 'PUT');
  if(r.error){ msg('rq-msg', r.error, false); return; }
  refreshAll();
}

async function submitReview(rideId, driverUserId){
  if(!driverUserId){
    const el = g(`review-msg-${rideId}`);
    if(el) el.innerHTML = '<div class="alert alert-err">Driver information missing</div>';
    return;
  }
  const score = g(`score-${rideId}`).value;
  const comment = g(`comment-${rideId}`).value;
  const r = await api('/ratings','POST',{ride_id:rideId,rated_by:'Rider',rated_user_id:driverUserId,score,comment});
  const el = g(`review-msg-${rideId}`);
  if(el) el.innerHTML = `<div class="alert ${r.error?'alert-err':'alert-ok'}">${r.message || r.error}</div>`;
  if(!r.error){
    state.ratings.add(String(rideId));
    renderRides();
  }
}

function logout(){
  localStorage.removeItem('role');
  localStorage.removeItem('user_id');
  localStorage.removeItem('rider_id');
  localStorage.removeItem('driver_id');
  localStorage.removeItem('active_ride_id');
  window.location.href = 'index.html';
}

init();
</script>
</body>
</html>
