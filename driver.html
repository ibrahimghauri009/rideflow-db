<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RideFlow - Driver</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3f4f6;
  --white: #ffffff;
  --crimson: #dc143c;
  --crimson-dark: #b01030;
  --crimson-light: #fff1f2;
  --border: #e5e7eb;
  --text: #111827;
  --muted: #6b7280;
  --shadow: 0 10px 24px rgba(0,0,0,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Poppins', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

.header {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 0 28px;
  height: 60px;
  display: flex;
  align-items: center;
  gap: 14px;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: var(--shadow);
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-icon {
  width: 34px; height: 34px; border-radius: 9px;
  background: var(--crimson); color: #fff; display: flex; align-items: center;
  justify-content: center; font-size: 0.9rem; font-weight: 700;
}
.logo-name { font-size: 0.92rem; font-weight: 700; }
.logo-sub { font-size: 0.6rem; color: var(--muted); font-weight: 400; }
.header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

.icon {
  width: 14px;
  height: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-right: 6px;
  color: var(--crimson);
}
.icon svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }

.btn {
  font-family: 'Poppins', sans-serif;
  font-size: 0.72rem;
  font-weight: 600;
  padding: 7px 14px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  transition: all 0.15s;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn-pri { background: var(--crimson); color: #fff; }
.btn-pri:hover { background: var(--crimson-dark); transform: translateY(-1px); }
.btn-out { background: transparent; color: var(--crimson); border: 1px solid var(--crimson); }
.btn-out:hover { background: var(--crimson-light); }
.btn-ghost { background: #f9fafb; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover { color: var(--text); }
.btn-sm { padding: 5px 11px; font-size: 0.67rem; }
.btn-full { width: 100%; margin-top: 12px; justify-content: center; }
.btn:disabled { opacity: 0.6; cursor: not-allowed; }

.content { padding: 26px 28px; max-width: 980px; margin: 0 auto; }

.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
  animation: fadeUp 0.2s ease;
}
.card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
.card-title { font-size: 0.82rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.card-sub { font-size: 0.64rem; color: var(--muted); margin-top: 2px; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(6px);} to {opacity:1; transform: translateY(0);} }

.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 720px){ .g2 { grid-template-columns: 1fr; } }

label { display: block; font-size: 0.68rem; font-weight: 500; margin-bottom: 4px; margin-top: 12px; }
label:first-child { margin-top: 0; }
input, textarea, select {
  width: 100%;
  font-family: 'Poppins', sans-serif;
  font-size: 0.75rem;
  padding: 8px 11px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #fff;
  color: var(--text);
  outline: none;
  transition: border 0.15s;
}
input:focus, textarea:focus, select:focus { border-color: var(--crimson); }
textarea { resize: vertical; min-height: 70px; }

.badge { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 20px; font-size: 0.6rem; font-weight: 600; }
.bg { background: #dcfce7; color: #166534; }
.bb { background: #e0f2fe; color: #1d4ed8; }
.by { background: #fef3c7; color: #92400e; }
.br { background: #fee2e2; color: #991b1b; }
.bgr { background: #f3f4f6; color: var(--muted); }

.tag {
  display: inline-flex;
  align-items: center;
  padding: 2px 6px;
  border-radius: 6px;
  font-size: 0.6rem;
  font-weight: 600;
  background: var(--crimson-light);
  color: #9f1239;
  margin-left: 6px;
}

.alert { padding: 9px 13px; border-radius: 8px; font-size: 0.71rem; font-weight: 500; margin-top: 10px; }
.alert-ok { background: #dcfce7; border: 1px solid #bbf7d0; color: #166534; }
.alert-err { background: #fee2e2; border: 1px solid #fecaca; color: #991b1b; }

.ride-wrap { margin-bottom: 12px; }
.ride-wrap.open .ride-card { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.ride-card {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  background: #fafafa;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.ride-card:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(0,0,0,0.08); }
.ride-title { font-size: 0.78rem; font-weight: 600; }
.ride-meta { font-size: 0.7rem; color: var(--muted); line-height: 1.6; margin-top: 6px; }
.ride-actions { display: flex; flex-direction: column; gap: 6px; }

.ride-details {
  display: none;
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 12px 12px;
  background: #fff;
  padding: 12px 14px;
}
.ride-details.open { display: block; animation: slideDown 0.2s ease; }
@keyframes slideDown { from { opacity:0; transform: translateY(-4px);} to {opacity:1; transform: translateY(0);} }

.detail-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; font-size: 0.7rem; color: var(--muted); }
@media (max-width: 720px){ .detail-grid { grid-template-columns: 1fr; } }

.offer-card {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 8px;
  background: #fafafa;
}
.offer-meta { font-size: 0.68rem; color: var(--muted); line-height: 1.6; }

.note {
  font-size: 0.68rem;
  color: var(--muted);
  margin-top: 8px;
}
</style>
</head>
<body>

<header class="header">
  <div class="logo">
    <div class="logo-icon">R</div>
    <div><div class="logo-name">RideFlow</div><div class="logo-sub">Driver Console</div></div>
  </div>
  <div class="header-right">
    <div style="font-size:0.72rem;color:var(--muted)">Driver ID: <b id="driver-id">--</b></div>
    <button class="btn btn-out" onclick="logout()">
      <span class="icon"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></span>
      Logout
    </button>
  </div>
</header>

<div class="content">
  <div class="card">
    <div class="card-head">
      <div>
        <div class="card-title">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></span>
          Status & Earnings
        </div>
        <div class="card-sub">Manage availability and track wallet balance</div>
      </div>
    </div>
    <div class="g2">
      <div>
        <div style="font-size:0.7rem;color:var(--muted);margin-bottom:6px">Availability</div>
        <div style="font-size:1.1rem;font-weight:700" id="drv-availability">—</div>
        <button class="btn btn-out btn-sm" id="drv-toggle" style="margin-top:10px" onclick="toggleAvailability()">Toggle</button>
        <div id="drv-msg"></div>
      </div>
      <div>
        <div style="font-size:0.7rem;color:var(--muted);margin-bottom:6px">Wallet Balance</div>
        <div style="font-size:1.1rem;font-weight:700" id="drv-wallet">PKR —</div>
        <div class="note">Total trips: <b id="drv-trips">—</b></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <div>
        <div class="card-title">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M12 2C7.6 2 4 5.6 4 10c0 5.6 8 12 8 12s8-6.4 8-12c0-4.4-3.6-8-8-8z"/><circle cx="12" cy="10" r="3"/></svg></span>
          Rides
        </div>
        <div class="card-sub">Open requests, active trips, completed and cancelled rides</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <select id="ride-filter" onchange="renderRides()" style="width:190px">
          <option value="all">All</option>
          <option value="open">Open Requests</option>
          <option value="progress">In Progress</option>
          <option value="awaiting">Awaiting Acknowledgement</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
          <option value="review">Needs Review</option>
        </select>
        <button class="btn btn-ghost btn-sm" onclick="refreshAll()">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v7h-7"/></svg></span>
          Refresh
        </button>
      </div>
    </div>
    <div id="rides-list"><div style="text-align:center;padding:20px;font-size:0.72rem;color:var(--muted)">Loading rides...</div></div>
  </div>
</div>

<script>
const API = window.location.protocol === 'file:' ? 'http://localhost:5000/api' : `${window.location.origin}/api`;
const STATUS_CLASS = {Requested:'by',Offered:'bb','In Progress':'bb','Rider Completed':'by','Rider Cancelled':'br',Completed:'bg',Cancelled:'br'};
const ACTIVE_STATUSES = new Set(['In Progress','Rider Completed','Rider Cancelled']);
const CLOSED_STATUSES = new Set(['Completed','Cancelled']);

let driverId = null;
let driverUserId = null;
let state = {
  open: [],
  assigned: [],
  history: [],
  ratings: new Set(),
  offers: {},
  byId: {},
  reco: {},
  profile: null,
  vehicleId: null
};

function g(id){ return document.getElementById(id); }
function bdg(v){ return `<span class="badge ${STATUS_CLASS[v]||'bgr'}">${v}</span>`; }
function msg(id, text, ok=true){ const el=g(id); if(el) el.innerHTML = `<div class="alert ${ok?'alert-ok':'alert-err'}">${text}</div>`; }

async function api(path, method='GET', body=null){
  try{
    const opts = { method, headers: {'Content-Type':'application/json'} };
    if(body) opts.body = JSON.stringify(body);
    return (await fetch(API + path, opts)).json();
  }catch{ return { error: 'Server offline' }; }
}

async function init(){
  const role = localStorage.getItem('role');
  if(role !== 'driver'){ window.location.href = 'index.html'; return; }
  driverUserId = localStorage.getItem('user_id');
  const drivers = await api('/drivers');
  if(Array.isArray(drivers)){
    const match = drivers.find(d => String(d.user_id) === String(driverUserId));
    if(match){
      driverId = match.driver_id;
      state.profile = match;
      g('driver-id').textContent = driverId;
    }
  }
  if(!driverId){
    g('rides-list').innerHTML = '<div class="alert alert-err">Driver profile not found. Signup as driver first.</div>';
    return;
  }
  // Fetch this driver's verified vehicle so we can attach it to offers
  const vehicles = await api('/vehicles');
  if(Array.isArray(vehicles)){
    const myVehicle = vehicles.find(v => String(v.driver_id) === String(driverId) && v.verification_status === 'Verified');
    if(myVehicle) state.vehicleId = myVehicle.vehicle_id;
  }
  refreshAll();
}

async function refreshAll(){
  if(!driverId) return;
  const [open, assigned, history, ratings, drivers] = await Promise.all([
    api(`/rides?status=Requested,Offered&unassigned=1&city=${encodeURIComponent(state.profile.city || '')}`),
    api(`/rides?driver_id=${driverId}`),
    api(`/ride-history?driver_id=${driverId}`),
    api('/ratings'),
    api('/drivers')
  ]);

  state.open = Array.isArray(open) ? open : [];
  state.assigned = Array.isArray(assigned) ? assigned.filter(r => !CLOSED_STATUSES.has(r.ride_status)) : [];
  state.history = Array.isArray(history) ? history : [];
  state.ratings = new Set((Array.isArray(ratings) ? ratings : []).filter(r => r.rated_by === 'Driver').map(r => String(r.ride_id)));
  state.reco = {};
  if(Array.isArray(drivers)){
    const match = drivers.find(d => String(d.driver_id) === String(driverId));
    if(match){
      state.profile = match;
      renderDriverStats();
    }
  }
  renderRides();
}

function renderDriverStats(){
  if(!state.profile) return;
  g('drv-availability').textContent = state.profile.availability_status || 'Offline';
  g('drv-wallet').textContent = `PKR ${parseFloat(state.profile.wallet_balance || 0).toFixed(0)}`;
  g('drv-trips').textContent = state.profile.total_trips || 0;
  const isOnline = state.profile.availability_status === 'Online';
  g('drv-toggle').textContent = isOnline ? 'Go Offline' : 'Go Online';
}

async function toggleAvailability(){
  if(!driverId || !state.profile) return;
  const next = state.profile.availability_status === 'Online' ? 'Offline' : 'Online';
  const r = await api(`/drivers/${driverId}/availability`, 'PUT', { availability_status: next });
  const el = g('drv-msg');
  if(el) el.innerHTML = `<div class="alert ${r.error?'alert-err':'alert-ok'}">${r.message || r.error}</div>`;
  if(!r.error){
    state.profile.availability_status = next;
    renderDriverStats();
  }
}

function normalizeRide(r, type){
  const status = type === 'history' ? r.final_status : r.ride_status;
  return {
    id: r.ride_id,
    type,
    status,
    pickup: r.pickup_location,
    dropoff: r.dropoff_location,
    fare: r.fare,
    distance: r.distance_km,
    duration: r.duration_min,
    created_at: r.created_at,
    archived_at: r.archived_at,
    rider_id: r.rider_id,
    rider_name: r.rider_name
  };
}

function collectRides(){
  const open = state.open.map(r => normalizeRide(r, 'open'));
  const assigned = state.assigned.map(r => normalizeRide(r, 'assigned'));
  const history = state.history.map(r => normalizeRide(r, 'history'));
  const list = [...assigned, ...open, ...history];
  return list.sort((a,b) => {
    const ta = new Date(a.archived_at || a.created_at || 0).getTime();
    const tb = new Date(b.archived_at || b.created_at || 0).getTime();
    return tb - ta;
  });
}

function matchesFilter(ride, filter){
  if(filter === 'open') return ['Requested','Offered'].includes(ride.status) && ride.type === 'open';
  if(filter === 'progress') return ride.status === 'In Progress';
  if(filter === 'awaiting') return ['Rider Completed','Rider Cancelled'].includes(ride.status);
  if(filter === 'completed') return ride.status === 'Completed';
  if(filter === 'cancelled') return ride.status === 'Cancelled';
  if(filter === 'review') return ride.status === 'Completed' && !state.ratings.has(String(ride.id));
  return true;
}

function renderRides(){
  const filter = g('ride-filter').value;
  const rides = collectRides().filter(r => matchesFilter(r, filter));
  state.byId = {};
  rides.forEach(r => { state.byId[r.id] = r; });
  if(!rides.length){
    g('rides-list').innerHTML = '<div style="text-align:center;padding:20px;font-size:0.72rem;color:var(--muted)">No rides found</div>';
    return;
  }
  g('rides-list').innerHTML = rides.map(renderRideCard).join('');
}

function renderRideCard(ride){
  const needsReview = ride.status === 'Completed' && !state.ratings.has(String(ride.id));
  const busy = state.assigned.some(r => ACTIVE_STATUSES.has(r.ride_status));

  let actions = '';
  if(ride.type === 'open'){
    actions = `
      <button class="btn btn-pri btn-sm" onclick="toggleDetails(${ride.id}, true)" ${busy ? 'disabled' : ''}>
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg></span>
        Offer
      </button>
      <button class="btn btn-out btn-sm" onclick="rejectRide(${ride.id})">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg></span>
        Reject
      </button>
      <button class="btn btn-ghost btn-sm" onclick="toggleDetails(${ride.id}, true)">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M3 12h18"/><path d="M3 6h18"/><path d="M3 18h18"/></svg></span>
        Details
      </button>
    `;
  } else if(ride.type === 'assigned'){
    if(['Rider Completed','Rider Cancelled'].includes(ride.status)){
      actions = `
        <button class="btn btn-pri btn-sm" onclick="ackRide(${ride.id})">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></span>
          Acknowledge
        </button>
        <button class="btn btn-ghost btn-sm" onclick="toggleDetails(${ride.id}, false)">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M3 12h18"/><path d="M3 6h18"/><path d="M3 18h18"/></svg></span>
          Details
        </button>
      `;
    } else {
      actions = `<div style="font-size:0.7rem;color:var(--muted)">In progress</div>`;
    }
  } else {
    actions = `
      <button class="btn btn-ghost btn-sm" onclick="toggleDetails(${ride.id}, false)">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M3 12h18"/><path d="M3 6h18"/><path d="M3 18h18"/></svg></span>
        Details
      </button>
      ${needsReview ? `<button class="btn btn-pri btn-sm" onclick="toggleDetails(${ride.id}, true)"><span class="icon"><svg viewBox="0 0 24 24"><path d="M12 17l-5 3 2-6-5-4h6l2-6 2 6h6l-5 4 2 6z"/></svg></span>Review</button>` : ''}
    `;
  }

  const tag = needsReview ? '<span class="tag">Needs Review</span>' : '';
  const riderLabel = ride.rider_name ? `${ride.rider_name} (ID ${ride.rider_id})` : `Rider #${ride.rider_id || '-'}`;

  return `
    <div class="ride-wrap" id="wrap-${ride.id}">
      <div class="ride-card">
        <div>
          <div class="ride-title">Ride #${ride.id} ${bdg(ride.status)} ${tag}</div>
          <div class="ride-meta">${ride.pickup || '-'} -> ${ride.dropoff || '-'}<br>Rider: ${riderLabel}<br>Fare: PKR ${ride.fare || '—'}</div>
        </div>
        <div class="ride-actions">${actions}</div>
      </div>
      <div class="ride-details" id="details-${ride.id}">
        ${renderDetails(ride, needsReview)}
      </div>
    </div>
  `;
}

function renderDetails(ride, needsReview){
  const timeLabel = ride.archived_at ? `Archived: ${ride.archived_at}` : (ride.created_at ? `Created: ${ride.created_at}` : '');
  const details = `
    <div class="detail-grid">
      <div><b>Status:</b> ${ride.status}</div>
      <div><b>Time:</b> ${timeLabel || '-'}</div>
      <div><b>Distance:</b> ${ride.distance || '-'} km</div>
      <div><b>Duration:</b> ${ride.duration || '-'} min</div>
    </div>
    <div id="fare-${ride.id}" class="note">Recommended fare: calculating...</div>
  `;

  let extra = '';
  if(ride.type === 'open'){
    extra = `
      <div style="margin-top:12px">
        <div style="font-size:0.74rem;font-weight:600">Offer a fare</div>
        <label>Proposed Fare (PKR)</label>
        <input id="offer-${ride.id}" type="number" step="1" placeholder="e.g. 350">
        <button class="btn btn-ghost btn-sm" onclick="applyRecommended(${ride.id})" style="margin-top:8px">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></span>
          Use Recommended
        </button>
        <button class="btn btn-pri btn-sm" onclick="submitOffer(${ride.id})" style="margin-top:8px">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg></span>
          Send Offer
        </button>
        <div id="offer-msg-${ride.id}"></div>
        <div id="offers-${ride.id}"><div class="note">Loading offers...</div></div>
      </div>
    `;
  }

  if(ride.status === 'Completed' && needsReview){
    extra += `
      <div style="margin-top:12px">
        <div style="font-size:0.74rem;font-weight:600">Leave a review</div>
        <label>Score</label>
        <select id="score-${ride.id}"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select>
        <label>Comment</label>
        <textarea id="comment-${ride.id}" placeholder="Your feedback"></textarea>
        <button class="btn btn-pri btn-sm" onclick="submitReview(${ride.id}, ${ride.rider_id || 0})" style="margin-top:8px">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M12 17l-5 3 2-6-5-4h6l2-6 2 6h6l-5 4 2 6z"/></svg></span>
          Submit Review
        </button>
        <div id="review-msg-${ride.id}"></div>
      </div>
    `;
  }
  return details + extra;
}

function toggleDetails(rideId, loadOffers){
  const wrap = g(`wrap-${rideId}`);
  const details = g(`details-${rideId}`);
  const isOpen = details.classList.contains('open');
  if(isOpen){
    details.classList.remove('open');
    wrap.classList.remove('open');
    return;
  }
  details.classList.add('open');
  wrap.classList.add('open');
  if(loadOffers){
    loadOffersForRide(rideId);
  }
  loadFareForRide(rideId);
}

async function loadOffersForRide(rideId){
  const host = g(`offers-${rideId}`);
  if(!host) return;
  const data = await api(`/rides/${rideId}/offers`);
  if(!Array.isArray(data) || !data.length){
    host.innerHTML = '<div class="note">No offers yet</div>';
    return;
  }
  host.innerHTML = data.map(o => {
    const yourOffer = String(o.driver_id) === String(driverId) ? '<span class="tag">Your offer</span>' : '';
    return `
      <div class="offer-card">
        <div>
          <div style="font-size:0.78rem;font-weight:600">PKR ${parseFloat(o.proposed_fare).toFixed(0)} ${yourOffer}</div>
          <div class="offer-meta">Driver: <b>${o.driver_name || 'Driver #' + o.driver_id}</b><br>Status: ${bdg(o.status)}</div>
        </div>
      </div>
    `;
  }).join('');
}

async function loadFareForRide(rideId){
  const ride = state.byId[rideId];
  const host = g(`fare-${rideId}`);
  if(!ride || !host){
    return;
  }
  if(!ride.distance || !ride.duration){
    host.textContent = 'Recommended fare: distance data missing';
    return;
  }
  const payload = {
    vehicle_type: 'Economy',
    distance_km: ride.distance,
    duration_min: ride.duration
  };
  const r = await api('/fare/recommend', 'POST', payload);
  if(r.error){
    host.textContent = 'Recommended fare unavailable';
    return;
  }
  state.reco[rideId] = Math.round(r.final_fare);
  host.innerHTML = `Recommended fare (Economy): <b>PKR ${parseFloat(r.final_fare).toFixed(0)}</b>`;
}

function applyRecommended(rideId){
  const val = state.reco[rideId];
  const input = g(`offer-${rideId}`);
  if(!input){
    return;
  }
  if(!val){
    input.placeholder = 'Recommended fare not loaded';
    return;
  }
  input.value = val;
}

async function submitOffer(rideId){
  const fareEl = g(`offer-${rideId}`);
  if(!fareEl || !fareEl.value){
    const el = g(`offer-msg-${rideId}`);
    if(el) el.innerHTML = '<div class="alert alert-err">Enter a fare amount</div>';
    return;
  }
  const r = await api(`/rides/${rideId}/offer`, 'POST', { driver_id: driverId, proposed_fare: fareEl.value, vehicle_id: state.vehicleId });
  const el = g(`offer-msg-${rideId}`);
  if(el) el.innerHTML = `<div class="alert ${r.error?'alert-err':'alert-ok'}">${r.message || r.error}</div>`;
  if(!r.error){
    loadOffersForRide(rideId);
    refreshAll();
  }
}

async function rejectRide(rideId){
  const r = await api(`/rides/${rideId}/reject`, 'POST', { driver_id: driverId });
  const el = g('drv-msg');
  if(el) el.innerHTML = `<div class="alert ${r.error?'alert-err':'alert-ok'}">${r.message || r.error}</div>`;
  if(!r.error){
    refreshAll();
  }
}

async function ackRide(rideId){
  const r = await api(`/rides/${rideId}/driver-ack`, 'PUT');
  if(r.error){ msg('rides-list', r.error, false); return; }
  refreshAll();
}

async function submitReview(rideId, riderUserId){
  if(!riderUserId){
    const el = g(`review-msg-${rideId}`);
    if(el) el.innerHTML = '<div class="alert alert-err">Rider information missing</div>';
    return;
  }
  const score = g(`score-${rideId}`).value;
  const comment = g(`comment-${rideId}`).value;
  const r = await api('/ratings','POST',{ride_id:rideId,rated_by:'Driver',rated_user_id:riderUserId,score,comment});
  const el = g(`review-msg-${rideId}`);
  if(el) el.innerHTML = `<div class="alert ${r.error?'alert-err':'alert-ok'}">${r.message || r.error}</div>`;
  if(!r.error){
    state.ratings.add(String(rideId));
    renderRides();
  }
}

function logout(){
  localStorage.removeItem('role');
  localStorage.removeItem('user_id');
  localStorage.removeItem('rider_id');
  localStorage.removeItem('driver_id');
  localStorage.removeItem('active_ride_id');
  window.location.href = 'index.html';
}

init();
</script>
</body>
</html>
